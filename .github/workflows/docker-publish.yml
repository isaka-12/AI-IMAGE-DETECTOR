# Tests the code, smoke-tests the built image, then publishes it to Docker Hub
# as isaka12/ai-image-detector-lamp. Nothing is pushed unless every test passes.
#
#   push to main        -> :latest and :sha-<commit>
#   tag v1.2.3          -> :1.2.3, :1.2 and :sha-<commit>
#   pull request        -> tests and smoke test only, nothing is pushed
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):

#
# The .env file with the Sightengine keys is never committed (.gitignore) and never
# copied into the image (.dockerignore); keys are mounted at run time instead.
name: Test and publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: isaka12/ai-image-detector-lamp

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: fileinfo, zlib, iconv
          coverage: none

      - name: Lint PHP
        run: find app public tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint JavaScript and shell
        run: |
          node --check public/app.js
          bash -n docker/entrypoint.sh tests/smoke.sh

      - name: Unit tests
        run: php tests/run.php

  image:
    name: Build, smoke-test and publish image
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ai-scanner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: tests/smoke.sh ai-scanner:ci

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same Dockerfile and build cache as the tested image, so this step reuses its layers
      - name: Push to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
