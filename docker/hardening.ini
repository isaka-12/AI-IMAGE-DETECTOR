expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

file_uploads = On
upload_max_filesize = 10M
post_max_size = 11M
max_file_uploads = 1

allow_url_fopen = Off
allow_url_include = Off
open_basedir = /var/www:/tmp:/usr/share/php
; curl stays enabled: app/Sightengine.php calls the pixel-analysis API over HTTPS
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,curl_multi_exec,parse_ini_file,show_source

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
