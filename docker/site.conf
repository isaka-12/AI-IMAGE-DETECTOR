<VirtualHost *:8080>
    DocumentRoot /var/www/public

    <Directory /var/www/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        # Only PHP + static assets; block dotfiles
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # App code lives outside the docroot; make sure it is never served
    <Directory /var/www/app>
        Require all denied
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
