ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
Timeout 30
LimitRequestBody 11534336

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    # script/style only from our own files (no inline), previews via blob:, fetch only to ourselves
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
</IfModule>